
services:

  vault:
    image: vault:1.13.3
    command: vault server -config=/Vault/vault-config.json
    ports:
      - "8300:8300"
    environment:
      VAULT_API_ADDR: http://localhost:8300
      VAULT_ADDR: http://localhost:8300
    volumes:
      - vault-data:/vault/file
      - ./vault-config.json:/Vault/vault-config.json
    cap_add:
      - IPC_LOCK

  rabbitmq:
    image: masstransit/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest     
      - RABBITMQ_DEFAULT_PASS=guest

  webapi:
    build:
      context: .
      dockerfile: src/WebApi/Docker/Dockerfile.WebApi
    ports:
      - "8080:80"     # HTTP
      - "8443:443"    # HTTPS
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=dev-password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/https-dev-cert.pfx
    volumes:
      - ./https-dev-cert.pfx:/https/https-dev-cert.pfx:ro
    depends_on:
      - rabbitmq
      - vault

volumes:
  vault-data: